<svg width="1000" height="690" viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="640" height="440" fill="white"/>

<!-- Navegador -->
<rect x="20" y="14" width="380" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="210" y="39" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="13" fill="#2C2C2A">Navegador del usuario (HTTP)</text>
<line x1="210" y1="54" x2="210" y2="84" stroke="#333333" stroke-width="1.4" marker-start="url(#ar)" marker-end="url(#ar)"/>

<!-- Vista -->
<rect x="20" y="84" width="380" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="210" y="106" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="13" fill="#085041">Vista (Template de Django)</text>
<text x="210" y="124" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#0F6E56">HTML + Bootstrap: login, dashboard, servidores, historial</text>
<line x1="210" y1="140" x2="210" y2="176" stroke="#333333" stroke-width="1.4" marker-start="url(#ar)" marker-end="url(#ar)"/>

