<text x="421" y="196" text-anchor="middle" font-family="Arial" font-size="9" fill="#5F5E5A">datos</text>

<!-- SO -->
<rect x="440" y="268" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="530" y="290" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="11.5" fill="#2C2C2A">Equipo monitoreado</text>
<text x="530" y="306" text-anchor="middle" font-family="Arial" font-size="10" fill="#5F5E5A">CPU, RAM, disco, batería</text>
