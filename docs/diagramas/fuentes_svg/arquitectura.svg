<text x="530" y="198" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="11.5" fill="#0C447C">Agente de telemetría</text>
<text x="530" y="214" text-anchor="middle" font-family="Arial" font-size="10" fill="#185FA5">psutil (módulo recolector)</text>
