<text x="210" y="216" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#854F0B">Recibe la petición, evalúa alertas y arma la respuesta</text>
<line x1="210" y1="232" x2="210" y2="268" stroke="#333333" stroke-width="1.4" marker-start="url(#ar)" marker-end="url(#ar)"/>

