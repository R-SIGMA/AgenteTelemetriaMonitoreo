<text x="440" y="360" font-family="Arial" font-weight="bold" font-size="11" fill="#2C2C2A">Leyenda</text>
<line x1="440" y1="376" x2="476" y2="376" stroke="#333333" stroke-width="1.4"/>
<text x="484" y="380" font-family="Arial" font-size="10" fill="#2C2C2A">Flujo actual</text>
