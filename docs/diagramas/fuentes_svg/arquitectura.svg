<text x="210" y="382" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="13" fill="#3C3489">Base de datos</text>
<text x="210" y="400" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#534AB7">PostgreSQL en Neon (SQLite como respaldo local)</text>

<!-- WebSockets (dashed) -->
<rect x="440" y="84" width="180" height="56" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="5,3"/>
<text x="530" y="106" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="11.5" fill="#085041">Django Channels</text>
<text x="530" y="122" text-anchor="middle" font-family="Arial" font-size="10" fill="#0F6E56">WebSockets (mejora Sprint 3)</text>
<line x1="440" y1="112" x2="402" y2="112" stroke="#0F6E56" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#ar)"/>

