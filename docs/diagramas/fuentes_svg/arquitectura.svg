<text x="210" y="290" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="13" fill="#0C447C">Modelo (Models + ORM de Django)</text>
<text x="210" y="308" text-anchor="middle" font-family="Arial" font-size="10.5" fill="#185FA5">Usuario, Servidor, Reporte</text>
<line x1="210" y1="324" x2="210" y2="360" stroke="#333333" stroke-width="1.4" marker-start="url(#ar)" marker-end="url(#ar)"/>

